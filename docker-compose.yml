version: '3.8'

services:
  # ----------------------------------------------------
  # 1. 数据库服务 (默认使用轻量稳定的 MariaDB，亦可无缝切换 mysql:8.0 或 postgres:16-alpine)
  # ----------------------------------------------------
  db:
    # 如需使用极轻量 MariaDB (约 100MB 内存)：
    # image: mariadb:10.11
    # 如需使用官方 MySQL 8.0：
    # image: mysql:8.0
    # 如需使用极轻量 PostgreSQL (Alpine 镜像仅约 80MB)：
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      # MySQL / MariaDB 变量
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-aeronote}
      MYSQL_USER: ${DB_USER:-aeronote}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aeronote_password}
      # PostgreSQL 兼容环境变量
      POSTGRES_DB: ${DB_NAME:-aeronote}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aeronote_password}
    ports:
      # 如果使用 MySQL / MariaDB，请将端口映射切换为:
      # - "${DB_PORT:-3306}:3306"
      # 如果使用 PostgreSQL:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # - ./data/mysql:/var/lib/mysql
      # 如果使用 PostgreSQL，请将挂载路径切换为:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - aeronote

  # ----------------------------------------------------
  # 2. AeroNote 全栈一体化服务 (Nginx + React SPA + Flask + Gunicorn)
  # ----------------------------------------------------
  aeronote:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-hesccc/aeronote:latest}
    container_name: aeronote
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - DB_TYPE=${DB_TYPE:-postgres}
      - FLASK_ENV=production
    ports:
      # 外部访问的主端口 (默认映射宿主机 80 端口，可通过 .env 的 FRONTEND_PORT 覆盖)
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      # 持久化挂载上传的文件、临时文件与运行日志
      - ./uploads:/app/uploads
      - ./temp:/app/temp
      - ./logs:/app/logs
    networks:
      - aeronote

networks:
  aeronote:
    driver: bridge
